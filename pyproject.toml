[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reelwright"
version = "0.1.0"
description = "An MCP server that lets AI agents edit video through a structured timeline, with transcripts, scene detection, and preview renders for self-checking."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "BitLess246" }]
keywords = ["mcp", "model-context-protocol", "video-editing", "ffmpeg", "ai-agents"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video :: Non-Linear Editor",
]
dependencies = [
  "mcp>=1.20",
  "pydantic>=2.6",
  "pillow>=10",
]

[project.optional-dependencies]
transcribe = ["faster-whisper>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
reelwright = "reelwright.cli:main"

[project.urls]
Homepage = "https://github.com/BitLess246/Reelwright"

[tool.hatch.build.targets.wheel]
packages = ["src/reelwright"]

[tool.pytest.ini_options]
testpaths = ["tests"]
